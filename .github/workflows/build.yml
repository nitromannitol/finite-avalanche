name: Current source CI (22 inputs)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: finite-avalanche-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, warnings and registered axiom boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Reclaim unused hosted-runner SDK space
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${RUNNER_OS:-}" = Linux
          df -h /
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android
          df -h /
      - name: Set up pinned Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Restore source dependency artifacts
        id: dependency-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages/*/.lake/build
          key: dependencies-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Check toolchain and build warning-free
        shell: bash
        run: bash scripts/ci_build.sh
      - name: Save successful dependency artifacts
        if: success() && steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/packages/*/.lake/build
          key: dependencies-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Upload all verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ github.sha }}-${{ github.run_attempt }}
          path: .lake/verification-logs/
          if-no-files-found: error
