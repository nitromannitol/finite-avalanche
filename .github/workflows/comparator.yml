name: Current Main comparator (22 inputs)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: finite-avalanche-comparator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  comparator:
    name: Main theorem — Lean and NanoDa replay
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Reclaim unused hosted-runner SDK space
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${RUNNER_OS:-}" = Linux
          df -h /
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android
          df -h /
      - name: Set up pinned Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Restore source dependency artifacts
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages/*/.lake/build
          key: dependencies-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      # Validate installed dependencies before verification-tool setup.
      - name: Require complete reviewed comparator pairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/comparator-logs
          python3 -B scripts/prepare_public_comparators.py --check 2>&1 | tee .lake/comparator-logs/preflight.log
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
      - name: Build pinned verification tools
        shell: bash
        run: bash scripts/build_comparator_tools.sh "${RUNNER_TEMP}/finite-avalanche-tools"
      - name: Run genuine comparisons
        shell: bash
        env:
          COMPARATOR_TOOLS: ${{ runner.temp }}/finite-avalanche-tools
        run: bash scripts/run_comparators.sh
      - name: Upload comparator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparator-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .lake/comparator-logs/
            audit/main-comparator/
            ${{ runner.temp }}/finite-avalanche-tools/tool-receipt.json
            ${{ runner.temp }}/finite-avalanche-tools/*-build.log
          if-no-files-found: error
